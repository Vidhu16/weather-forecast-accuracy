# Save this file as .github/workflows/collect.yml in your repo
name: Collect weather data

on:
  schedule:
    # Every 6 hours at minute 17 (UTC): 00:17, 06:17, 12:17, 18:17.
    # Round-hour schedules are the most delayed on GitHub, so 17 is used on purpose.
    - cron: "17 */6 * * *"
  workflow_dispatch:         # lets you run it manually from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python collect.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
